name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: '1.26.0'

    - name: Build
      run: GOWORK=off go build -o vertex-runtime ./cmd/vertex-runtime/

    - name: Test with race detector and coverage
      run: GOWORK=off go test ./... -v -race -count=1 -coverprofile=coverage.out

    - name: Upload coverage artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage
        path: coverage.out
        retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: '1.26.0'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
      with:
        version: v2.12.2
      env:
        GOWORK: "off"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Build runtime image
      run: docker build -t promptkit-vertex-runtime:ci .

# The SonarCloud job is intentionally absent until the SonarCloud project
# AltairaLabs_promptarena-deploy-vertex exists and SONAR_TOKEN is set as a repo
# secret. sonar-project.properties is already in place; adding the job before
# the project exists would fail CI on every push. Mirror the `sonar` job from
# promptarena-deploy-omnia/.github/workflows/ci.yml once both are configured.
