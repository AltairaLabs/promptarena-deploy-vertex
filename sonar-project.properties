sonar.projectKey=AltairaLabs_promptarena-deploy-vertex
sonar.organization=altairalabs

sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out

# Exclude only the process entry point from coverage. Everything it wires
# together (config, providers, pack, agent, handlers, turn, server) is
# unit-tested and IS coverage-gated.
sonar.coverage.exclusions=**/main.go

sonar.sourceEncoding=UTF-8
