sonar.projectKey=AltairaLabs_promptarena-deploy-vertex
sonar.organization=altairalabs

sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out

# Exclude the process entry point and the one live Cloud Storage write.
# Everything main.go wires together (config, providers, pack, agent, handlers,
# turn, server) is unit-tested and IS coverage-gated.
#
# storage_real.go is a single function that opens a GCS client and writes an
# object. It cannot be exercised without either real credentials or a storage
# emulator, the same reason agentcore excludes aws_client_real.go. It is a file
# of its own precisely so this line names it and nothing else: the URI it is
# given, the decision to stage, and the skip on an unchanged pack all live in
# staging.go and are covered.
# Live-client glue: each of these forwards calls to a Google API and cannot run
# without a project, so a test would assert the forwarding and nothing else.
# The logic they wrap is tested through the interfaces they satisfy.
sonar.coverage.exclusions=**/main.go,**/storage_real.go,**/sessionstore_real.go,**/client_real.go

sonar.sourceEncoding=UTF-8
